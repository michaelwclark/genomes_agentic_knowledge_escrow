name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    # One arm64 runner builds both architectures: the x64 SEA is the same blob
    # injected into the official, checksum-verified darwin-x64 Node, so there
    # is a single SHA256SUMS and no dependency on x64 runner availability.
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read Node version
        id: node-version
        run: echo "version=$(cat .nvmrc)" >> "$GITHUB_OUTPUT"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ steps.node-version.outputs.version }}
          cache: npm

      - name: Tag must match package.json version
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "${GITHUB_REF_NAME}" != "v${version}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match package.json version v${version}" >&2
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run check

      - name: Test
        run: npm test

      - name: Scrub check (source tree)
        run: node scripts/scrub-check.mjs

      - name: Build release tarballs
        run: npm run build:release

      - name: Scrub check (staged plugin dirs and binaries)
        run: node scripts/scrub-check.mjs --artifacts release/stage

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${GITHUB_REF_NAME}" release/dist/* \
            --title "Knowledge Escrow ${GITHUB_REF_NAME}" \
            --generate-notes \
            --verify-tag
